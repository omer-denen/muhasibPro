name: Velopack Release

# Kullanım:
#   git tag v1.1.2
#   git push origin v1.1.2
# Sürümün tek kaynağı tag'dir (v öneki atılır): hem exe (csproj)
# hem paket (vpk pack -v) aynı sürümü alır. Uygulama tarafı değişiklik
# gerektirmez — FeedUrl'e repo adresi yazılınca GithubSource
# Release'teki nupkg'leri otomatik bulur.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Release oluşturmak için şart

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Sürümü tag'den al (v öneki atılır)
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: csproj sürümünü tag ile eşitle
        shell: pwsh
        run: |
          $xml = [xml](Get-Content 'MuhasibPro/MuhasibPro.csproj')
          $node = $xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1
          $node.Version = '${{ steps.version.outputs.version }}'
          $xml.Save('MuhasibPro/MuhasibPro.csproj')

      - name: Publish
        run: dotnet publish MuhasibPro/MuhasibPro.csproj -c Release -o publish

      - name: vpk kur
        run: dotnet tool install --global vpk

      - name: Önceki sürümü indir (delta paketi için)
        continue-on-error: true # ilk release'te önceki yoktur, sorun değil
        run: vpk download github -o Releases --repoUrl https://github.com/omer-denen/muhasibPro --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: vpk pack -u MuhasibPro -v ${{ steps.version.outputs.version }} -p publish -e MuhasibPro.exe -o Releases

      - name: GitHub Release'e yükle
        run: vpk upload github -o Releases --repoUrl https://github.com/omer-denen/muhasibPro --token ${{ secrets.GITHUB_TOKEN }} --publish --tag ${{ github.ref_name }}
